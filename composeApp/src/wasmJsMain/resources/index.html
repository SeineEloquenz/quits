<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quits</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
    <link rel="icon" href="favicon-16.png" sizes="16x16" type="image/png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#00665C">
    <style>
        html, body { margin: 0; padding: 0; height: 100%; background: #1c1b1f; }
        #loader {
            position: fixed; inset: 0; z-index: 1;
            display: flex; align-items: center; justify-content: center;
            background: #FEF7FF; color: #006A60;
        }
        @media (prefers-color-scheme: dark) {
            #loader { background: #141218; color: #53DBC9; }
        }
        #loader svg { width: 40px; height: 40px; animation: loader-rotate 1.4s linear infinite; }
        #loader circle {
            fill: none; stroke: currentColor; stroke-width: 4; stroke-linecap: round;
            animation: loader-dash 1.4s ease-in-out infinite;
        }
        @keyframes loader-rotate { to { transform: rotate(360deg); } }
        @keyframes loader-dash {
            0% { stroke-dasharray: 1 150; stroke-dashoffset: 0; }
            50% { stroke-dasharray: 85 150; stroke-dashoffset: -30; }
            100% { stroke-dasharray: 85 150; stroke-dashoffset: -112; }
        }
    </style>
</head>
<body>
<div id="loader" role="progressbar" aria-label="Loading Quits">
    <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18"/></svg>
</div>
<script type="application/javascript" src="composeApp.js"></script>
<script type="application/javascript">
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
            // Absolute path pins the scope to '/', so registration works even when the app is
            // opened at a deep link like /join.
            navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
    }
</script>
</body>
</html>
