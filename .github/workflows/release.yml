name: Release
# Required repository secrets:
#   KEYSTORE, KEYSTORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD
#   SERVICE_ACCOUNT_JSON  – only needed for publish-play
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    uses: SeineEloquenz/ci/.github/workflows/android-release.yml@main
    with:
      version-file: gradle.properties
      test-task: ":androidApp:testDebugUnitTest"
      assemble-task: ":androidApp:assembleRelease"
      bundle-task: ":androidApp:bundleRelease"
      apk-path: androidApp/build/outputs/apk/release
      bundle-path: androidApp/build/outputs/bundle/release
      publish-play: false
      play-package-name: nz.eloque.quits
      play-track: internal
    secrets:
      KEYSTORE: ${{ secrets.KEYSTORE }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
